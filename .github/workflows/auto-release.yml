name: Auto release

# Every product merge to master cuts an official release. The release
# commit itself carries the stamped plugin artifacts (bin/agent-bar,
# bundle.json, manifest version), so the repository root is always the
# complete installable plugin tree and `omarchy plugin update` receives
# exactly one fast-forward commit per release.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '*.qml'
      - 'Core*.js'
      - 'components/**'
      - 'icons/**'
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    # Pinned image: scripts/agent-bar-build-helper must reproduce the same
    # bytes on the verify-release runner.
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'release:')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Fetch dependencies
        run: cargo fetch

      - name: Cut release (bump + notes + manifest stamp)
        id: cut
        run: |
          set -euo pipefail
          scripts/agent-bar-cut-release
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Rust gates
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build release helper reproducibly
        run: scripts/agent-bar-build-helper

      - name: Stamp plugin artifacts into the repo root
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          BUILD_RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mkdir -p target/release
          cp -f target/x86_64-unknown-linux-gnu/release/agent-bar target/release/agent-bar
          cargo run --bin agent-bar-bundle -- stamp \
            source-commit "$SOURCE_COMMIT" build-run "$BUILD_RUN"
          scripts/check-version "v${{ steps.cut.outputs.version }}" .

      - name: Attest helper provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: bin/agent-bar

      - name: Root inventory / modes / architecture
        run: |
          set -euo pipefail
          test -f bundle.json
          test -f manifest.json
          test -x bin/agent-bar
          test -x scripts/agent-bar-open-terminal
          file bin/agent-bar | grep -E 'ELF 64-bit|x86-64|x86_64'
          bin/agent-bar version
          # QML/Quattro gates consume accepted checkpoint evidence on
          # Omarchy hosts; Ubuntu runners have no Omarchy runtime.

      - name: Commit, tag, push, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md "docs/releases/${VERSION}.md" \
            manifest.json bundle.json preview.png bin/agent-bar
          git commit -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:master "refs/tags/v${VERSION}"
          gh release create "v${VERSION}" \
            --title "Agent Bar ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"

      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # exact-commit verification is dispatched explicitly on the new tag.
      # It runs after publication: a red Verify release does not roll the
      # release back, it flags it (docs/dev/releasing.md#provenance).
      - name: Dispatch verify-release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: gh workflow run verify-release.yml --ref "v${VERSION}"
