[package]
name = "agent-bar"
version = "10.5.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "LLM quota monitor for Claude, Codex, Amp, Grok, and Antigravity."
repository = "https://github.com/othavi0/agent-bar"

[[bin]]
name = "agent-bar"
path = "src/main.rs"

[[bin]]
name = "agent-bar-bundle"
path = "src/bin/agent-bar-bundle.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "local-offset", "formatting", "parsing", "macros"] }
tempfile = "3"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "io-std", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
regex = "1"
semver = "1.0.28"
fs2 = "0.4.3"
sha2 = "0.11.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
jsonschema = { version = "0.33", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
